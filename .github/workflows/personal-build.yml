name: Windows x64 portable release
on:
  workflow_dispatch:
  push:
    tags: ['v*']
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - run: npm ci
      - run: npm test
      - run: npm run sync -- disableUpdate
      - run: npx --no-install electron-builder --config electron-builder-windows.json --win dir --x64 --publish never
      - name: Create portable ZIP and Scoop manifest
        shell: pwsh
        run: |
          $version = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME.Substring(1) } else { (Get-Content drawio/VERSION -Raw).Trim() }
          ./build/package-scoop.ps1 -Version $version -Repository $env:GITHUB_REPOSITORY
      - uses: actions/upload-artifact@v6
        with:
          name: drawio-desktop-windows-x64
          path: |
            dist/*.zip
            dist/drawio-desktop.json
          if-no-files-found: error
  release:
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v6
        with:
          name: drawio-desktop-windows-x64
      - name: Publish tag assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" *.zip drawio-desktop.json --verify-tag --repo "$GITHUB_REPOSITORY" --generate-notes
